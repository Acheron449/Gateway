name: gateway-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant-app-v1/backend
    env:
      GATEWAY_ENV: test
      GATEWAY_EXECUTION_MODE: paper
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-full.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall app
      - name: Dependency audit
        run: pip-audit -r requirements-full.txt
      - name: Static security scan
        run: bandit -r app -lll
      - name: Run tests
        run: python -m pytest tests/ -q

  cloudflare-root:
    name: Cloudflare root build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Assert root is not a Python project
        run: test ! -f requirements.txt && test ! -f requirements-dev.txt && test ! -f Pipfile && test ! -f pyproject.toml
      - name: Build from repository root
        run: npm run build
      - name: Verify static output
        run: test -f dist/index.html && test ! -e dist/_redirects
      - name: Validate Wrangler deploy config
        run: npx --yes wrangler@4.158.0 versions upload --dry-run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant-app-v1/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check and build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e -- --workers=1
