              - paragraph
              - paragraph [ref=e589]: "MetaTrader 5 developers, on the other hand, access economic data through:"
              - list [ref=e590]:
                - listitem [ref=e591]:
                  - text: Utilizing
                  - link "MQL5's Economic Calendar functions" [ref=e592] [cursor=pointer]:
                    - /url: https://www.mql5.com/en/docs/calendar
                - listitem [ref=e593]:
                  - text: Web scraping
                  - link "Forex Factory's main page" [ref=e594] [cursor=pointer]:
                    - /url: https://www.forexfactory.com/
                - listitem [ref=e595]:
                  - text: Web scraping
                  - link "Forex Factory's weekly XML" [ref=e596] [cursor=pointer]:
                    - /url: https://nfs.faireconomy.media/ff_calendar_thisweek.xml
                - listitem [ref=e597]:
                  - text: Web scraping
                  - link "Forex Factory's weekly JSON" [ref=e598] [cursor=pointer]:
                    - /url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
              - paragraph
              - paragraph [ref=e599]:
                - text: While Forex Factory publicly lists its event data, ethical standards are still considered in web scraping. If Forex Factory intended traders to access their information via an API, similar to their weekly JSON and XML data, they would provide it. In contrast,
                - link "Metaquotes's Economic Calendar" [ref=e600] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/economic-calendar
                - text: can be directly accessed through MQL5's (a coding language for MT5)
                - link "Economic Calendar functions" [ref=e601] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/docs/calendar
                - text: . Introducing the News API. This API utilizes
                - link "Open AI's fine-tuning model" [ref=e602] [cursor=pointer]:
                  - /url: https://platform.openai.com/docs/guides/fine-tuning
                - text: ","
                - link "Scikit-Learn" [ref=e603] [cursor=pointer]:
                  - /url: https://scikit-learn.org/stable/getting_started.html
                - text: (Machine Learning), and
                - link "MQL5’s Economic Calendar functions" [ref=e604] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/docs/calendar
                - text: to provide News API access to developers across all computer languages, including MQL5, MQL4, and Python. It is completely free to use and can be accessed via GET requests or our
                - link "News Library for Python and MQL" [ref=e605] [cursor=pointer]:
                  - /url: https://www.jblanked.com/news/api/docs/
                - text: ". The API comprises seven main endpoints: 1. Event List - List of News Events 2. Event Info - Name, ID, Currency, and Category 3. Event History - Name, ID, Currency, Category, and History with the Strength, Quality, Projection, and Outcome of each event and the 1 minute, 30 minute, and 1 hour price action of each event 4. Machine Learning - Name, ID, Currency, Category, and Machine Learning predictions (bullish/bearish) on each of the 13 possible event outcomes 5. Smart Analysis - Name, ID, Currency, Category, and Smart Analysis (bullish/bearish) on each of the 13 possible event outcomes 6. Full Event List - List of News Events with Name, ID, Currency, Category, History, Machine Learning, and Smart Analysis 7. Calendar - List of News Events, in order by time, with Name, ID, Currency, Category, Date, Actual, Forecast, Previous, Outcome, Strength, Quality, and Projection. 8. GPT - Bullish/Bearish sentiment on News Event outcomes, Hawkish/Dovish sentiment on Statements and Speeches, and education on forex and news analysis concepts. Here are some of the potential use cases and benefits:"
              - list [ref=e606]:
                - listitem [ref=e607]: Live trade news events
                - listitem [ref=e608]: Backtest news trading strategies with EAs and Indicators
                - listitem [ref=e609]: Use Machine learning to enhance your news analysis and provide your EA with a "brain"
                - listitem [ref=e610]: Display news event from day to day
              - paragraph
              - paragraph [ref=e611]:
                - text: "For more information and access, refer to the documentation:"
                - link "News API Documentation" [ref=e612] [cursor=pointer]:
                  - /url: https://www.jblanked.com/news/api/docs/
                - text: "Here's how to access it via Python using a GET request:"
              - generic [ref=e613]:
                - generic [ref=e614]: Inserted Code
                - generic [ref=e615]: "import requests url = \"https://www.jblanked.com/news/api/list/\" headers = { \"Content-Type\": \"application/json\", \"Authorization\": \"Api-Key YOUR-API-KEY-HERE\", } response = requests.get(url, headers=headers) if response.status_code == 200: data = response.json() print(data) else: print(response.status_code)"
              - text: "Here's how to access it via MQL4/MQL5 using a GET request via Wininet.dll:"
