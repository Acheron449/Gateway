version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: ./quant-app-v1/backend/Dockerfile
    container_name: quant-app-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
      GATEWAY_PROVIDER_KEY_FILE: /run/secrets/gateway_provider_key
    env_file:
      - .env.docker
    secrets:
      - gateway_provider_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./quant-app-v1/backend/app:/app:ro
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./quant-app-v1/frontend
      dockerfile: Dockerfile
    container_name: quant-app-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: quant-app-postgres
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
  gateway_provider_key:
    file: ./secrets/gateway_provider_key.txt

networks:
  quant-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local